# PagesCMS configuration — edit content at app.pagescms.org
# Collections mirror src/content.config.ts loaders 1:1.
media:
  input: public/images
  output: /images

content:
  - name: events
    label: Eventi
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - { name: id, label: Slug univoco (minuscole-trattini), type: string, required: true }
      - { name: title, label: Titolo, type: string, required: true }
      - { name: date, label: Data (testo, es. "13 apr 2026"), type: string, required: true }
      - { name: dateISO, label: Data ordinamento (AAAA-MM-GG), type: date, required: true }
      - { name: endDate, label: Fine, type: string }
      - { name: location, label: Luogo, type: string }
      - { name: type, label: Tipo, type: string }
      - { name: cover, label: Copertina, type: image }
      - name: status
        label: Stato
        type: select
        options:
          values: [upcoming, past]
      - { name: body, label: Testo, type: rich-text }

  - name: news
    label: Notizie
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - { name: title, label: Titolo, type: string, required: true }
      - { name: date, label: Data, type: string, required: true }
      - { name: body, label: Testo, type: rich-text }

  - name: committees
    label: Comitati locali
    type: file
    path: src/data/committees.yml
    format: yaml
    list: true
    fields:
      - { name: id, label: Slug univoco, type: string, required: true }
      - { name: name, label: Nome (città), type: string, required: true }
      - { name: lat, label: Latitudine (pin sulla mappa), type: number, required: true }
      - { name: lon, label: Longitudine (pin sulla mappa), type: number, required: true }
      - { name: president, label: Presidente, type: string }
      - { name: founded, label: Fondazione (MM/AAAA), type: string }
      - { name: email, label: Email, type: string }
      - name: status
        label: Stato
        type: select
        options:
          values: [active, frozen]
      - { name: photo, label: Foto presidente, type: image }
      - { name: logo, label: Logo, type: image }
      - { name: past_presidents, label: Presidenti passati, type: text }
      - { name: link, label: Link social, type: string }
      - { name: rules, label: Link regolamento, type: string }

  - name: executive
    label: Esecutivo
    type: file
    path: src/data/executive.yml
    format: yaml
    list: true
    fields:
      - { name: id, label: Slug univoco, type: string, required: true }
      - { name: name, label: Nome, type: string, required: true }
      - { name: role, label: Ruolo, type: string, required: true }
      - { name: bio, label: Bio, type: text }
      - { name: email, label: Email, type: string }
      - { name: photo, label: Foto, type: image }

  - name: documents
    label: Documenti
    type: file
    path: src/data/documents.yml
    format: yaml
    list: true
    fields:
      - { name: id, label: Slug univoco, type: string, required: true }
      - { name: year, label: Anno (vuoto per press kit e libro), type: string }
      - { name: group, label: Gruppo (Press kit, Documenti, tipo di riunione…), type: string, required: true }
      - { name: name, label: Nome, type: string, required: true }
      - { name: url, label: Link, type: string, required: true }
      - { name: ord, label: Ordinamento (solo per anni nuovi, numero alto = in fondo), type: number }
