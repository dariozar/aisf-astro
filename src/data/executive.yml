- id: federico-canterucci
  name: Federico Canterucci
  role: Presidente
  bio: 'Studente di Laurea Magistrale in Fisica Biomedica all’Università di Torino,
    ha maturato il suo legame con AISF prima come Presidente del Comitato Locale e
    poi come Responsabile Eventi Nazionale. La sua filosofia? Lanciarsi nei progetti:
    meglio rischiare di sbagliare che restare immobili. Trova la sua energia nell’umanità
    delle persone, che ama spronare affinché realizzino il proprio potenziale. La
    musica è il suo motore vitale mentre nel tempo libero cerca la bellezza e la storia
    del decadente praticando Urbex tra le rovine del Nord Italia, esplorando ciò che
    altri hanno dimenticato.'
  email: federico.canterucci@ai-sf.it
  photo: /img/esecutivo/canterucci.jpeg
- id: raimondo-lucariello
  name: Raimondo Lucariello
  role: Segretario
  bio: Studente del corso di laurea magistrale in Fisica Teorica e Sistemi Complessi
    presso l’Università degli Studi di Bari, è stato Presidente del comitato locale
    AISF di Bari. Inguaribile curioso e ossessionato dalla formalità, ha scelto la
    Fisica come vocazione naturale, per poi scoprire con entusiasmo la possibilità
    di applicarla allo studio delle neuroscienze, ambito che lo affascina profondamente.
    Tifoso della squadra di calcio della sua città, “la Bari”, non perde mai occasione
    per sostenerla.
  email: raimondo.lucariello@ai-sf.it
  photo: /img/esecutivo/lucariello.jpg
- id: valerio-tinari
  name: Valerio Tinari
  role: Tesoriere
  bio: Valerio studia Fisica alla Sapienza di Roma ed è appassionato di fisica delle
    alte energie e di analisi dati al LHC con tecniche di AI e ML. Nel tempo libero
    ama sciare e stare al mare; la Formula 1 invece preferisce guardarla, non guidarla.
  email: valerio.tinari@ai-sf.it
  photo: /img/esecutivo/tinari.jpg
- id: mario-lisciandrello
  name: Mario Lisciandrello
  role: Responsabile Relazioni con Membri e Comitati Locali
  bio: 'Studente di Fisica presso l''Università degli Studi di Palermo. Incuriosito
    dalle stelle e dallo spazio sin da bambino, vuole proseguire i suoi studi e fare
    ricerca scientifica nel campo dell''astrofisica. Mario è stato Presidente e Vicepresidente
    del LC di Palermo; esperienza che lo ha portato a mettersi in gioco, adesso però
    ci ha preso troppo la mano e parla pure con quelli della portineria. Ha una grande
    passione per lo sport: fa calcio, taekwondo, corre…forse è un po'' iperattivo.
    Nel tempo libero, se ne ha, ama cucinare e bere una birra con gli amici.'
  email: mario.lisciandrello@ai-sf.it
  photo: /img/esecutivo/lisciandrello.jpg
- id: luca-attina
  name: Luca Attinà
  role: Responsabile Eventi
  bio: Studente magistrale in Fisica Nucleare e Subnucleare presso l'Università di
    Torino, è prossimo alla conclusione del lavoro di tesi nell'ambito delle astroparticelle.
    Grande appassionato di divulgazione, si dedica a progetti e attività di insegnamento
    e comunicazione della scienza. Ha ricoperto il ruolo di Presidente del Comitato
    Locale di Torino, collaborando con numerosi ragazzi e ragazze per organizzare
    eventi innovativi. Nel tempo libero si diletta col collezionismo di vario genere,
    spaziando da oggetti della cultura pop a souvenir di viaggio, fino a campioni
    di elementi chimici.
  email: luca.attina@ai-sf.it
  photo: /img/esecutivo/Attinà.jpg
- id: dario-zarcone
  name: Dario Zarcone
  role: Vicepresidente e IT Manager
  bio: Dottorando presso il Dipartimento di Fisica e Chimica Emilio Segrè di Palermo,
    si occupa di sistemi complessi applicati allo studio del crimine e della storia.
    È tra i membri fondatori del Comitato Locale di Palermo, di cui è stato vicepresidente
    e segretario, e attualmente ricopre il ruolo di IT Manager dell’associazione.
    Appassionato di informatica, quando non è immerso tra server, codici e dataset
    coltiva entropicamente interessi sempre nuovi, sotto lo sguardo attento del suo
    gatto Goro.
  email: dario.zarcone@ai-sf.it
  photo: /img/esecutivo/zarcone.jpg
- id: adele-peluso
  name: Adele Peluso
  role: Concept Manager
  bio: Dopo una laurea triennale in Lettere presso l’Università Cattolica del Sacro
    Cuore, Adele Peluso studia Filosofia Europea Moderna e Contemporanea presso l’Università
    del Lussemburgo. Membro AISF dal 2021, ha contribuito a fondare il podcast Fisicaffè
    nel 2022 e ne ha assunto la co-direzione dal 2024 al 2026. Nel tempo libero principalmente
    scrive articoli a tema variabile tra arte e scienza. Entra nel Comitato Esecutivo
    dopo aver fatto parte dell’organizzazione di CISF26.
  email: ''
  photo: /img/esecutivo/peluso.jpeg
- id: maria-rosaria-sivo
  name: Maria Rosaria Sivo
  role: PR Manager
  bio: Studentessa di Fisica presso l’università di Bologna, ha un grande amore per
    l’astrofisica, la fisica delle particelle e la comunicazione scientifica. Ha contribuito
    attivamente alla rinascita di LC Bologna, assumendo i ruoli di SMM, responsabile
    PR e grafico. Il suo carattere solare e intraprendente la porta a buttarsi in
    nuove sfide e la sua empatia la aiuta a stringere saldi rapporti, sia interpersonali
    che lavorativi. Nel suo tempo libero si divide tra la passione per il canto, l’amore
    per i contenuti di animazione, le serie tv e gli amici.
  email: mariarosaria.sivo@ai-sf.it
  photo: /img/esecutivo/sivo.jpg
